    let markerMap = [];

    const map = L.map('map', { zoomControl: false }).setView([37.0292, 128.2115], 14);

    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        attribution: '&copy; Google Maps',
        maxZoom: 18
    }).addTo(map);

    function createCustomIcon(color) {
        let iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png';
        if (color === 'purple') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png';
        else if (color === 'blue') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png';
        else if (color === 'orange') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png';

        return L.icon({
            iconUrl: iconUrl,
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34]
        });
    }

    function getMarkerColor(vibe) {
        if (vibe === '맛') return 'purple';
        if (vibe === '결') return 'blue';
        if (vibe === '흥') return 'orange';
        return 'green';
    }

    places.forEach((p, idx) => {
        const color = getMarkerColor(p.vibe);
        const icon = createCustomIcon(color);

        const popupContent = `
            <div style="text-align:center; padding: 4px;">
                <div style="font-weight:800; font-size:0.95rem; margin-bottom:4px;">${p.name}</div>
                <button style="background:#2D4030; color:white; border:none; padding:6px 12px; border-radius:12px; font-size:0.75rem; font-weight:bold; cursor:pointer;" onclick="renderSidebar(${idx})">📖 상세 스토리 ➔</button>
            </div>
        `;

        const marker = L.marker([p.lat, p.lng], {icon: icon})
            .addTo(map)
            .bindPopup(popupContent);

        markerMap.push({ name: p.name, id: p.id, vibe: p.vibe, marker: marker, lat: p.lat, lng: p.lng });
    });

    function renderSidebar(index) {
        const p = places[index];
        const sidebar = document.getElementById('sidebar-box');

        map.flyTo([p.lat, p.lng], 16, { duration: 1.0 });

        let interviewHtml = "";
        if (p.interview && p.interview.trim() !== "") {
            interviewHtml = `
                <div style="font-size:0.75rem; font-weight:bold; color:var(--sage); margin-top:14px; margin-bottom:4px;">💬 마을 주민 이야기</div>
                <div class="interview-box">${p.interview}</div>
            `;
        }

        let ttsText = `${p.name}. 주소는 ${p.address}. 운영시간은 ${p.time}, 휴무일은 ${p.holiday}입니다.`;
        if (p.interview && p.interview.trim() !== "") {
            const cleanStory = p.interview.replace(/<br>/g, ' ').replace(/<[^>]*>?/gm, '');
            ttsText += ` 마을 주민 이야기입니다. ${cleanStory}`;
        }

        sidebar.innerHTML = `
            <div class="sheet-header-bar">
                <div class="sheet-handle" onclick="toggleBottomSheet()"></div>
                <button class="sheet-close-btn" onclick="closeBottomSheet()">✕</button>
            </div>

        document.getElementById('sidebar-box').classList.remove('expanded');
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('이 모바일 브라우저는 음성 안내를 지원하지 않습니다.');
        }
    }
</script>
