    let markerMap = [];

    const map = L.map('map', { zoomControl: false }).setView([37.0292, 128.2115], 14);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 18
    }).addTo(map);

    function moveSwallowTo(target) {
        let destLat = 37.0292, destLng = 128.2115, zoomLvl = 15;
        if (target === '수산') {
            destLat = 36.9750; destLng = 128.2450; zoomLvl = 13.5;
        }
        map.flyTo([destLat, destLng], zoomLvl, { duration: 1.2 });
    }

    function createCustomIcon(color) {
        let iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png';
        if (color === 'purple') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png';
        else if (color === 'blue') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png';
        else if (color === 'orange') iconUrl = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png';

        return L.icon({
            iconUrl: iconUrl,
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34]
        });
    }

    function getMarkerColor(vibe) {
        if (vibe === '맛') return 'purple';
        if (vibe === '결') return 'blue';
        if (vibe === '흥') return 'orange';
        return 'green';
    }

    places.forEach((p, idx) => {
        const color = getMarkerColor(p.vibe);
        const icon = createCustomIcon(color);

        const popupContent = `
            <div style="text-align:center; padding: 4px;">
                <div style="font-size:0.75rem; font-weight:bold; color:#2D4030;">[${p.off_num}]</div>
                <div style="font-weight:800; font-size:0.95rem; margin-bottom:4px;">${p.name}</div>
                <button style="background:#2D4030; color:white; border:none; padding:6px 12px; border-radius:12px; font-size:0.75rem; font-weight:bold; cursor:pointer;" onclick="renderSidebar(${idx})">📖 상세 정보 보기 ➔</button>
            </div>
        `;

        const marker = L.marker([p.lat, p.lng], {icon: icon})
            .addTo(map)
            .bindPopup(popupContent);

        markerMap.push({ name: p.name, id: p.id, vibe: p.vibe, marker: marker, lat: p.lat, lng: p.lng });
    });

    function filterMarkers(vibe, btnElement) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        markerMap.forEach(item => {
            if (vibe === 'ALL' || item.vibe === vibe) {
                if (!map.hasLayer(item.marker)) map.addLayer(item.marker);
            } else {
                if (map.hasLayer(item.marker)) map.removeLayer(item.marker);
            }
        });
    }

    function renderSidebar(index) {
        const p = places[index];
        const sidebar = document.getElementById('sidebar-box');

        map.flyTo([p.lat, p.lng], 16, { duration: 1.0 });

        // 💬 이야기 영역 합성 (특별한 이유 + 인터뷰)
        let storyContent = '';
        if (p.special !== '정보 없음') storyContent += `🌟 <b>특별한 이유:</b><br>${p.special}<br><br>`;
        if (p.interview) storyContent += `🗣️ <b>운영자 이야기:</b><br>${p.interview}`;
        if (!storyContent) storyContent = '소개 데이터 준비 중입니다.';

        let storyHtml = `<div class="story-container"><div style="font-weight:800; color:var(--sage); margin-bottom:6px; font-size:0.9rem;">💬 이야기</div>${storyContent}</div>`;

        let ttsText = `${p.name}. 주소는 ${p.address}. 운영시간은 ${p.time}, 휴무일은 ${p.holiday}입니다. 사전 연락 및 예약 유무는 ${p.pre_contact}입니다.`;
        if (p.special !== '정보 없음') ttsText += ` 이 장소가 특별한 이유는 ${p.special} 입니다.`;
        if (p.interview) ttsText += ` 운영자 이야기입니다. ${p.interview.replace(/<br>/g, ' ')}`;

        sidebar.innerHTML = `
            <div class="sheet-header-bar">
                <div class="sheet-handle" onclick="toggleBottomSheet()"></div>
                <button class="sheet-close-btn" onclick="closeBottomSheet()">✕</button>
            </div>
            <div>
                <div class="category-header-wrap">
                    <span class="category-badge cat-${p.vibe}">${p.vibe}의 공간</span>
                    <span class="off-num-tag">📍 지도 [${p.off_num}]</span>
                </div>
                
                <h2 class="place-title">${p.name}</h2>
                <div class="badge-container">${p.badges}</div>

                <table class="info-table">
                    <tr><td class="title">📍 주소</td><td>${p.address}</td></tr>
                    <tr><td class="title">🕒 운영시간</td><td>${p.time}</td></tr>
                    <tr><td class="title">📅 휴무일</td><td>${p.holiday}</td></tr>
                    <tr><td class="title">📞 연락처</td><td>${p.tel}</td></tr>
                    <tr><td class="title">🔔 사전연락/예약</td><td><b>${p.pre_contact}</b></td></tr>
                </table>

                <div style="font-size:0.75rem; font-weight:bold; opacity:0.6; margin-bottom:6px;">🚗 길찾기</div>
                ${p.nav}

                <div style="font-size:0.75rem; font-weight:bold; opacity:0.6; margin-top:14px; margin-bottom:6px;">🔗 로컬 커넥트</div>
                <div>${p.links}</div>

                ${storyHtml}

                <button class="tts-btn" onclick="speakText('${ttsText.replace(/'/g, "\'")}')">
                    🔊 상세 정보 및 이야기 음성으로 들려주기
                </button>
            </div>
        `;
        sidebar.scrollTop = 0;
        sidebar.classList.add('expanded');
    }

    function toggleBottomSheet() {
        document.getElementById('sidebar-box').classList.toggle('expanded');
    }

    function closeBottomSheet() {
        document.getElementById('sidebar-box').classList.remove('expanded');
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('이 모바일 브라우저는 음성 안내를 지원하지 않습니다.');
        }
    }
</script>
